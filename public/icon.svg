<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B2B"/>
      <stop offset="100%" stop-color="#080B12"/>
    </radialGradient>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="50%" stop-color="#36C5F0"/>
      <stop offset="100%" stop-color="#35D49A"/>
    </linearGradient>
    <linearGradient id="flowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36C5F0"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#7C5CFC" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="170" stroke="#36C5F0" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="24 16"/>
  <circle cx="256" cy="256" r="140" stroke="#7C5CFC" stroke-opacity="0.2" stroke-width="4"/>

  <!-- HabitFlow Central Command Crest: Stylized futuristic H with flow check -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar -->
    <rect x="148" y="140" width="44" height="232" rx="22" fill="url(#flowGrad1)"/>
    <!-- Right Pillar -->
    <rect x="320" y="140" width="44" height="232" rx="22" fill="url(#flowGrad1)"/>
    <!-- Dynamic Orbit Flow Crossbar -->
    <path d="M168 256 C210 210, 302 210, 344 256" stroke="url(#flowGrad2)" stroke-width="36" stroke-linecap="round"/>
    <!-- Core Success Flow Node -->
    <circle cx="256" cy="235" r="18" fill="#35D49A"/>
    <circle cx="256" cy="235" r="28" stroke="#35D49A" stroke-width="3" stroke-opacity="0.6"/>
  </g>
</svg>
